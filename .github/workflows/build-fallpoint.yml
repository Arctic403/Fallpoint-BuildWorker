name: Fallpoint Private Universal Build

on:
  repository_dispatch:
    types: [fallpoint-main-push]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Fallpoint branch, tag, or commit to build
        required: true
        default: main
        type: string
      publish:
        description: Publish completed APK back to the private Fallpoint repo
        required: true
        default: true
        type: boolean
  schedule:
    # Backup watcher in case an event is ever missed.
    - cron: '*/5 * * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fallpoint-build-worker
  cancel-in-progress: true

jobs:
  detect-fallpoint-change:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - name: Resolve Fallpoint source and detect new commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.FALLPOINT_PRIVATE_TOKEN }}
          REQUESTED_REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_sha || github.event.inputs.source_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'FALLPOINT_PRIVATE_TOKEN is required to read private Fallpoint.' >&2
            exit 1
          fi

          SOURCE_REF="$REQUESTED_REF"
          SOURCE_SHA="$(gh api "repos/Arctic403/Fallpoint/commits/${SOURCE_REF}" --jq '.sha')"

          echo "source_ref=${SOURCE_REF}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved Fallpoint ${SOURCE_REF} -> ${SOURCE_SHA}"

          # Manual runs always build the requested ref. Automatic runs only build
          # when that exact Fallpoint commit has not already been returned as a
          # private worker prerelease.
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api repos/Arctic403/Fallpoint/releases --paginate --jq '.[].body // ""' \
              | grep -Fq "Source ${SOURCE_SHA}."; then
            echo "Fallpoint ${SOURCE_SHA} already has a worker APK; nothing to do."
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
          else
            echo "New Fallpoint commit detected: ${SOURCE_SHA}"
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
          fi

  build-universal-apk:
    needs: detect-fallpoint-change
    if: ${{ needs.detect-fallpoint-change.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact private Fallpoint commit
        uses: actions/checkout@v4
        with:
          repository: Arctic403/Fallpoint
          ref: ${{ needs.detect-fallpoint-change.outputs.source_sha }}
          path: fallpoint
          token: ${{ secrets.FALLPOINT_PRIVATE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Confirm isolated checkout
        working-directory: fallpoint
        env:
          EXPECTED_SHA: ${{ needs.detect-fallpoint-change.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git config --get remote.origin.url | sed 's#\.git$##')" = "https://github.com/Arctic403/Fallpoint"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          printf 'Building Fallpoint commit %s\n' "$ACTUAL_SHA"
          test -f app/build.gradle
          test -f scripts/verify_universal_apk.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK pieces
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Verify Fallpoint source contract
        working-directory: fallpoint
        run: python3 scripts/verify_source_contract.py

      - name: Run portable Fallpoint smoke tests
        working-directory: fallpoint
        run: |
          set -euo pipefail
          bash scripts/run_host_smoke.sh
          bash scripts/run_backend_smoke.sh
          bash scripts/run_runtime_smoke.sh
          bash scripts/run_world_smoke.sh
          bash scripts/run_platform_smoke.sh
          bash scripts/run_player_smoke.sh

      - name: Prepare production character asset
        working-directory: fallpoint
        run: python3 scripts/prepare_character_asset.py

      - name: Run character asset contract smoke test
        working-directory: fallpoint
        run: bash scripts/run_character_asset_smoke.sh

      - name: Build universal debug APK
        working-directory: fallpoint
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify ARM32 and ARM64 packaging
        working-directory: fallpoint
        run: python3 scripts/verify_universal_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Stage completed APK only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fallpoint-output"
          cp fallpoint/app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/fallpoint-output/Fallpoint-universal-debug.apk"
          sha256sum "$RUNNER_TEMP/fallpoint-output/Fallpoint-universal-debug.apk"

      - name: Publish completed APK back to private Fallpoint
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.FALLPOINT_PRIVATE_TOKEN }}
          SOURCE_SHA: ${{ needs.detect-fallpoint-change.outputs.source_sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SOURCE_SHA:0:8}"
          TAG="worker-${GITHUB_RUN_ID}-${SHORT_SHA}"
          APK="$RUNNER_TEMP/fallpoint-output/Fallpoint-universal-debug.apk"
          gh release create "$TAG" "$APK" \
            --repo Arctic403/Fallpoint \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "Fallpoint worker build ${SHORT_SHA}" \
            --notes "Universal Android debug APK built by Arctic403/Fallpoint-BuildWorker run ${GITHUB_RUN_ID}. Source ${SOURCE_SHA}. Verified armeabi-v7a + arm64-v8a."

      - name: Do not publish public build artifacts
        run: |
          echo 'BuildWorker intentionally uploads no public Actions artifact.'
          echo 'Private builds are returned only through the private Fallpoint prerelease step.'
